# this_file: src_docs/mkdocs.yml
site_name: Remopy for FontLab
site_description: Remote FontLab sessions, tools and Glyphs scripting.
site_url: https://fontlabcom.github.io/fontlab-remopy/
repo_url: https://github.com/fontlabcom/fontlab-remopy
repo_name: fontlabcom/fontlab-remopy
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  language: en
  custom_dir: overrides
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Overview: index.md
  - Installation: installation.md
  - API and Glyphs CLI: api-and-glyphs-cli.md
  - Development and safety: development-and-safety.md
  - Licence: licence.md
extra_css:
  - stylesheets/local.css
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
hooks:
  - english_search.py
